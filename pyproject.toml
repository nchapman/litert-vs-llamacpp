[project]
name = "litert-vs-llamacpp"
version = "0.1.0"
description = "Head-to-head summarization performance benchmark: LiteRT-LM vs llama.cpp on IBM Granite 4.0 1B"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litert-lm==0.19.2",
    "ai-edge-litert==2.3.0",
    "ai-edge-quantizer==0.10.1",
    "transformers>=4.56.0",
    "datasets>=3.0.0",
    "rouge-score>=0.1.2",
    "jinja2>=3.1.0",
    "numpy>=1.26.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
convert = [
    "litert-torch==0.10.0",
    "torch>=2.4.0,<2.15.0",
]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litert_vs_llamacpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
